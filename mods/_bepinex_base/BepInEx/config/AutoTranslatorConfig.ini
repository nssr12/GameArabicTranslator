[Service]
Endpoint=CustomTranslate

[General]
Language=ar
FromLanguage=en
EnableIMGUI=False
EnableUGUI=True
EnableNGUI=True
EnableTextMesh=True
EnableTextMeshPro=True
MaxCharactersPerTranslation=200
IgnoreWhitespaceInTranslations=True
EnableTranslationScoping=False

[CustomTranslate]
Url=http://127.0.0.1:5001/

[Behaviour]
LoadStaticTranslations=False
OutputUntranslatedText=False
CopyToClipboard=False
