[Service]
endpoint=CustomTranslate
fallbackendpoint=

[General]
language=ar
fromlanguage=auto

[Files]
directory=resource\{Lang}\Text
outputfile=resource\{Lang}\Text\_AutoGeneratedTranslations.txt
substitutionfile=resource\{Lang}\Text\_Substitutions.txt
preprocessorsfile=resource\{Lang}\Text\_Preprocessors.txt
postprocessorsfile=resource\{Lang}\Text\_Postprocessors.txt

[Behaviour]
maxcharacterspertranslation=2000
ignorewhitespaceindialogue=True
enableuiresizing=True
enablebatching=True
usestatictranslations=True
enablesilentmode=False
handlerichtext=True

[Custom]
url=http://127.0.0.1:5001/
enableshortdelay=False
disablespamchecks=False

[Http]
requesttimeout=100
delaybetweenrequests=100
maxconcurrentrequests=10
